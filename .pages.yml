        label: Step Tagline
        type: string
      - name: description
        label: Step Description
        type: text
      - name: thumb
        label: Step Image
        type: image
        options:
          extensions: [jpg, jpeg, png, webp, svg, gif]
      - name: alt
        label: Image Alt Text
        type: string

  # ============================================================
  # 4. NAVBAR > MEET THE TEAM
  # ============================================================
  - name: team
    label: "4. Meet The Team: Our Core Team (Leadership & Specialists)"
    type: file

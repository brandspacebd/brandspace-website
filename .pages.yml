        type: number
      - name: title
        label: Core Value Title
        type: string
      - name: text
        label: Explanation
        type: text
      - name: thumb
        label: Illustration / Icon
        type: image
        options:
          extensions: [jpg, jpeg, png, webp, svg, gif]

  - name: work-process

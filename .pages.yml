      - name: name
        label: Full Name
        type: string
        required: true
      - name: designation
        label: Job Title / Role
        type: string
        description: Role (e.g. Creative Director, Lead Designer).
      - name: text
        label: Bio / Description
        type: text
        description: Short biography of the team member.
      - name: thumb
        label: Profile Photo
        type: image
        options:
          extensions: [jpg, jpeg, png, webp, svg, gif]

  - name: creative-network
    label: "4. Meet The Team: Our Creative Network (Global Creators)"
    type: file

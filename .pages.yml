# Pages CMS Configuration for Brandspace Website
# Documentation: https://pagescms.org/docs/configuration/

media:
  input: public/uploads
  output: /uploads
  categories: [image]
  extensions: [jpg, jpeg, png, webp, svg, gif]
  rename: safe

settings:
  content:
    merge: true
  commit:
    templates:
      create: "Create {path} (via Pages CMS)"
      update: "Update {path} (via Pages CMS)"
      delete: "Delete {path} (via Pages CMS)"

content:
  # ==========================================
  # 1. Site Settings
  # ==========================================
  - name: site-settings
    label: Site Settings
    type: file
    path: public/assets/jsonData/settings/siteSettings.json
    format: json
    fields:
      - name: siteName
        label: Website Name
        type: string
        description: The brand or company name displayed across the website.
      - name: websiteUrl
        label: Website Link / URL
        type: string
        description: Primary public website URL (e.g. https://www.brandspacebd.com).
      - name: logo
        label: Header Logo
        type: image
        options:
          extensions: [jpg, jpeg, png, webp, svg, gif]
        description: Primary logo image displayed in the website header navigation.
      - name: footerLogo
        label: Footer Logo
        type: image
        options:
          extensions: [jpg, jpeg, png, webp, svg, gif]
        description: Large logo displayed in the website footer.
      - name: email
        label: Contact Email
        type: string
        description: Primary public contact email address.
      - name: phone
        label: Contact Phone
        type: string
        description: Public telephone / WhatsApp number.
      - name: address
        label: Physical Address / Location
        type: text
        description: Office address or location string shown in footer, sidebar and contact areas.
      - name: copyright
        label: Copyright Text
        type: string
        description: Footer copyright statement text.
      - name: socialLinks
        label: Social Media Links
        type: object
        description: URLs for social media profile icons in header, footer, and off-canvas menu.
        fields:
          - name: instagram
            label: Instagram URL
            type: string
          - name: twitter
            label: Twitter / X URL
            type: string
          - name: behance
            label: Behance URL
            type: string
          - name: dribbble
            label: Dribbble URL
            type: string

  # ==========================================
  # 2. Homepage Content
  # ==========================================
  - name: homepage
    label: Homepage Content
    type: file
    path: public/assets/jsonData/homepage/homeData.json
    format: json
    fields:
      - name: hero
        label: Hero Section
        type: object
        description: Top banner content on the homepage.
        fields:
          - name: title1
            label: Hero Heading Line 1
            type: string
            description: First animated main title line (e.g. Imagination).
          - name: title2
            label: Hero Heading Line 2
            type: string
            description: Second animated main title line (e.g. Meets Innovation).
          - name: quote1
            label: Agency Quote Paragraph 1
            type: text
            description: First half of the inspirational agency statement.
          - name: quote2
            label: Agency Quote Paragraph 2
            type: text
            description: Second half of the inspirational agency statement.
          - name: authorName
            label: Quote Author Name
            type: string
            description: Name of the executive / founder quoted in the hero section.
          - name: authorRole
            label: Quote Author Role
            type: string
            description: Title or role of the author (e.g. Chief Executive Officer).
          - name: buttonText
            label: CTA Button Text
            type: string
            description: Text on the primary action button (e.g. Let's Connect).
          - name: buttonUrl
            label: CTA Button URL
            type: string
            description: Link destination for the action button (e.g. /contact).
          - name: video
            label: Hero Video URL / Path
            type: string
            description: Video asset path (e.g. /assets/video/hero-video.mp4).
      - name: about
        label: Homepage About Section
        type: object
        description: Introductory about block on the homepage.
        fields:
          - name: subtitle
            label: Section Subtitle
            type: string
          - name: description
            label: About Description
            type: text
            description: Full animated introduction text on the homepage.
      - name: aboutPage
        label: About Us Page Text
        type: object
        description: Main text content for the dedicated /about page.
        fields:
          - name: subtitle
            label: Subtitle
            type: string
          - name: description1
            label: First Paragraph
            type: text
            description: First animated paragraph on the /about page.
          - name: description2
            label: Second Paragraph
            type: text
            description: Second animated paragraph on the /about page.
      - name: projects
        label: Homepage Projects Section Header
        type: object
        description: Header and call-to-action above featured projects on the homepage.
        fields:
          - name: subtitle
            label: Section Subtitle
            type: string
          - name: title
            label: Section Title
            type: string
          - name: description
            label: Section Description
            type: text
          - name: buttonText
            label: Button Text
            type: string
          - name: buttonUrl
            label: Button URL
            type: string

  # ==========================================
  # 3. Services
  # ==========================================
  - name: services
    label: Services
    type: file
    path: public/assets/jsonData/services/ServicesV1Data.json
    format: json
    list: true
    fields:
      - name: id
        label: Service ID
        type: number
        required: true
        description: Unique numerical ID for routing to /service-details/[id].
      - name: name
        label: Service Title
        type: string
        required: true
        description: The title of the service.
      - name: icon
        label: Service Icon
        type: image
        options:
          extensions: [jpg, jpeg, png, webp, svg, gif]
        description: Icon graphic representing the service.
      - name: thumb
        label: Thumbnail Image
        type: image
        options:
          extensions: [jpg, jpeg, png, webp, svg, gif]
        description: Card preview image shown in the services grid.
      - name: thumbFull1
        label: Detail Image 1
        type: image
        options:
          extensions: [jpg, jpeg, png, webp, svg, gif]
        description: First large showcase image on the /service-details/[id] page.
      - name: thumbFull2
        label: Detail Image 2
        type: image
        options:
          extensions: [jpg, jpeg, png, webp, svg, gif]
        description: Second large showcase image on the /service-details/[id] page.
      - name: text
        label: Summary Description
        type: text
        description: Brief overview of the service offering.
      - name: description
        label: Detail Page Overview
        type: text
        description: Extended introductory description shown at the top of /service-details/[id].
      - name: price
        label: Starting Price
        type: string
        description: Price figure (e.g. 3000).

  # ==========================================
  # 4. Featured Projects (Homepage)
  # ==========================================
  - name: featured-projects
    label: Featured Projects (Homepage)
    type: file
    path: public/assets/jsonData/feature/FeatureV1Data.json
    format: json
    list: true
    fields:
      - name: id
        label: Project ID
        type: number
        required: true
        description: Unique numerical ID matching detail route /project-details/[id].
      - name: projectName
        label: Project Name
        type: string
        required: true
      - name: info
        label: Category / Tag
        type: string
        description: Category tag (e.g. Brand Identity, Marketing, Web Design).
      - name: subTitle1
        label: Subtitle Line 1
        type: string
      - name: subTitle2
        label: Subtitle Line 2
        type: string
      - name: thumb
        label: Project Image
        type: image
        options:
          extensions: [jpg, jpeg, png, webp, svg, gif]
      - name: date
        label: Date / Year
        type: string

  # ==========================================
  # 5. All Projects (Portfolio Grid & Details)
  # ==========================================
  - name: all-projects
    label: All Projects (Portfolio Grid)
    type: file
    path: public/assets/jsonData/feature/FeatureV2Data.json
    format: json
    list: true
    fields:
      - name: id
        label: Project ID
        type: number
        required: true
        description: Unique numerical ID matching detail route /project-details/[id].
      - name: name
        label: Project Name
        type: string
        required: true
      - name: info
        label: Category / Tag
        type: string
        description: Category tag (e.g. Brand Identity, Marketing, Web Design).
      - name: textFirst
        label: First Description Line
        type: string
      - name: textLast
        label: Second Description Line
        type: string
      - name: description
        label: Full Project Description
        type: text
        description: Extended description displayed on the /project-details/[id] page.
      - name: thumb
        label: Project Image
        type: image
        options:
          extensions: [jpg, jpeg, png, webp, svg, gif]
      - name: date
        label: Date / Year
        type: string

  # ==========================================
  # 6. Blog & Articles
  # ==========================================
  - name: blog
    label: Blog & Articles
    type: file
    path: public/assets/jsonData/feature/FeatureV3Data.json
    format: json
    list: true
    fields:
      - name: id
        label: Article ID
        type: number
        required: true
        description: Unique numerical ID matching detail route /blog-details/[id].
      - name: title
        label: Article Headline
        type: string
        required: true
        description: Main article title displayed on listings and headers.
      - name: title2
        label: Secondary Headline / Topic
        type: string
        description: Extended topic title shown on the detail page.
      - name: author
        label: Author Name
        type: string
        description: Name of the writer or contributor.
      - name: date
        label: Publication Date
        type: string
        description: Formatted publish date (e.g. 9 Jan 2024).
      - name: comment
        label: Category / Topic Tag
        type: string
        description: Short topic or category phrase.
      - name: thumb
        label: Card Thumbnail
        type: image
        options:
          extensions: [jpg, jpeg, png, webp, svg, gif]
        description: Blog card image for listings.
      - name: thumbFull
        label: Full Article Cover Image
        type: image
        options:
          extensions: [jpg, jpeg, png, webp, svg, gif]
        description: Large featured hero image for /blog-details/[id].
      - name: content
        label: Full Article Content
        type: rich-text
        options:
          format: html
          switcher: true
        description: Full article body editor with rich formatting, bold, italics, bullet lists, headings, and links.

  # ==========================================
  # 7. Team Members
  # ==========================================
  - name: team
    label: Team Members
    type: file
    path: public/assets/jsonData/team/TeamV1Data.json
    format: json
    list: true
    fields:
      - name: id
        label: Member ID
        type: number
        required: true
        description: Unique numerical ID matching detail route /team-details/[id].
      - name: name
        label: Full Name
        type: string
        required: true
      - name: designation
        label: Job Title / Role
        type: string
        description: Role (e.g. Creative Director, Lead Designer).
      - name: text
        label: Bio / Description
        type: text
        description: Short biography of the team member.
      - name: thumb
        label: Profile Photo
        type: image
        options:
          extensions: [jpg, jpeg, png, webp, svg, gif]

  # ==========================================
  # 8. Testimonials
  # ==========================================
  - name: testimonials
    label: Testimonials
    type: file
    path: public/assets/jsonData/testimonial/TestimonialData.json
    format: json
    list: true
    fields:
      - name: id
        label: Testimonial ID
        type: number
        required: true
      - name: name
        label: Client Name
        type: string
        required: true
      - name: designation
        label: Client Role & Company
        type: string
        description: e.g. CEO at GreenWave Energy
      - name: text
        label: Testimonial Quote
        type: text
        required: true
        description: Full client feedback or review statement.
      - name: thumb
        label: Client Photo / Avatar
        type: image
        options:
          extensions: [jpg, jpeg, png, webp, svg, gif]

  # ==========================================
  # 9. Frequently Asked Questions (FAQ)
  # ==========================================
  - name: faq
    label: Frequently Asked Questions
    type: file
    path: public/assets/jsonData/faq/FaqData.json
    format: json
    fields:
      - name: subtitle
        label: Section Subtitle
        type: string
      - name: title
        label: Section Title
        type: string
      - name: description
        label: Section Description
        type: text
      - name: items
        label: FAQ Questions & Answers
        type: object
        list: true
        fields:
          - name: id
            label: Question ID
            type: number
          - name: number
            label: Index Numeral
            type: string
            description: Roman or ordinal numeral (e.g. I., II., III.).
          - name: question
            label: Question
            type: string
          - name: answer
            label: Answer
            type: text
            description: Full answer text.

  # ==========================================
  # 10. Company Values
  # ==========================================
  - name: company-values
    label: Company Values
    type: file
    path: public/assets/jsonData/services/ServicesV2Data.json
    format: json
    list: true
    fields:
      - name: id
        label: Value ID
        type: number
      - name: title
        label: Core Value Title
        type: string
      - name: text
        label: Explanation
        type: text
      - name: thumb
        label: Illustration / Icon
        type: image
        options:
          extensions: [jpg, jpeg, png, webp, svg, gif]

  # ==========================================
  # 11. Work Process Steps
  # ==========================================
  - name: work-process
    label: Work Process Steps
    type: file
    path: public/assets/jsonData/process/ProcessV1Data.json
    format: json
    list: true
    fields:
      - name: id
        label: Step ID
        type: number
      - name: number
        label: Step Number
        type: string
        description: e.g. I., II., III.
      - name: name
        label: Step Name
        type: string
      - name: designation
        label: Step Tagline
        type: string
      - name: description
        label: Step Description
        type: text
      - name: thumb
        label: Step Image
        type: image
        options:
          extensions: [jpg, jpeg, png, webp, svg, gif]
      - name: alt
        label: Image Alt Text
        type: string

  # ==========================================
  # 12. Fun Facts & Statistics
  # ==========================================
  - name: fun-facts
    label: Fun Facts & Statistics
    type: file
    path: public/assets/jsonData/fact/FactData.json
    format: json
    list: true
    fields:
      - name: id
        label: Stat ID
        type: number
      - name: title
        label: Metric Name
        type: string
        description: e.g. Years Experience, Completed Projects
      - name: end
        label: Numerical Value
        type: string
        description: Number value animated by counter (e.g. 12, 25, 110)
      - name: thumb
        label: Metric Icon
        type: image
        options:
          extensions: [jpg, jpeg, png, webp, svg, gif]

  # ==========================================
  # 13. Awards & Recognition
  # ==========================================
  - name: awards
    label: Awards & Recognition
    type: file
    path: public/assets/jsonData/awards/AwardsV1Data.json
    format: json
    list: true
    fields:
      - name: id
        label: Award ID
        type: number
      - name: title
        label: Award Title
        type: string
      - name: date
        label: Year / Period
        type: string

  # ==========================================
  # 14. Client Logos & Partners
  # ==========================================
  - name: partners
    label: Client Logos & Partners
    type: file
    path: public/assets/jsonData/partner/PartnerData.json
    format: json
    list: true
    fields:
      - name: id
        label: Partner ID
        type: number
      - name: thumb
        label: Partner Logo Image
        type: image
        options:
          extensions: [jpg, jpeg, png, webp, svg, gif]

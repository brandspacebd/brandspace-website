      - name: designation
        label: Job Title / Specialization
        type: string
        description: e.g. Senior 3D Product Designer & CGI Artist
      - name: text
        label: Bio / Track Record
        type: text
        description: Biography or specialization overview.
      - name: thumb
        label: Profile Photo
        type: image
        options:
          extensions: [jpg, jpeg, png, webp, svg, gif]


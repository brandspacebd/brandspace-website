# ============================================================
# Pages CMS Configuration for Brandspace Website
# Mirroring Live Website Structure & Navbar Architecture
# Documentation: https://pagescms.org/docs/configuration/
# ============================================================

media:
  input: public/uploads
  output: /uploads
  categories: [image]
  extensions: [jpg, jpeg, png, webp, svg, gif]
  rename: safe

settings:
  content:
    merge: true
  commit:
    templates:
      create: "Create {path} (via Pages CMS)"
      update: "Update {path} (via Pages CMS)"
      delete: "Delete {path} (via Pages CMS)"

content:
  # ============================================================
  # 0. PAGES: INDEPENDENT HERO BANNERS & IMAGES
  # ============================================================
  - name: page-heroes
    label: "Pages: All Hero Banners & Images (Per-Page Independent)"
    type: collection
    path: public/assets/jsonData/pages
    format: json
    description: "Customize the floating hero image, title, quote, and author for every page independently. Changing an image here ONLY affects that specific page!"
    fields:
      - name: pageName
        label: Page Name
        type: string
        description: Human-readable name of the page.
      - name: title
        label: Hero Main Heading
        type: string
        description: Primary title heading (e.g. About Us, The Works, Services, Juniorspace).
      - name: subtitle
        label: Hero Subtitle Line
        type: string
        description: Secondary line (e.g. Brandspace, Brandspace Venture).
      - name: heroImage
        label: Hero Floating Image
        type: image
        options:
          extensions: [jpg, jpeg, png, webp, svg, gif]
        description: Unique floating graphic for this page. Uploading or changing this image will NOT affect any other page.
      - name: quote
        label: Hero Inspirational Quote
        type: text
        description: Statement paragraph displayed in the top right.
      - name: authorName
        label: Quote Author Name
        type: string
      - name: authorRole
        label: Quote Author Role
        type: string
      - name: buttonText
        label: CTA Button Text
        type: string
      - name: buttonUrl
        label: CTA Button Link
        type: string

  # ============================================================
  # NAVBAR > SITE & GLOBAL BRANDING
  # ============================================================
  - name: site-settings
    label: "Navbar: Site Settings & Global Branding"
    type: file
    path: public/assets/jsonData/settings/siteSettings.json
    format: json
    description: "Global brand identities displayed across the website header navbar and footer."
    fields:
      - name: siteName
        label: Website Name
        type: string
        description: The brand or company name displayed across the website.
      - name: websiteUrl
        label: Website Link / URL
        type: string
        description: Primary public website URL (e.g. https://www.brandspacebd.com).
      - name: logo
        label: Header Logo
        type: image
        options:
          extensions: [jpg, jpeg, png, webp, svg, gif]
        description: Primary logo image displayed in the website header navigation.
      - name: favicon
        label: Website Favicon
        type: image
        options:
          extensions: [jpg, jpeg, png, webp, svg, gif]
        description: Browser tab favicon (SVG, PNG, ICO).
      - name: monogram
        label: Brand Monogram / App Icon
        type: image
        options:
          extensions: [jpg, jpeg, png, webp, svg, gif]
        description: Square brand symbol / monogram icon (e.g. Graphlink Viewer).
      - name: footerLogo
        label: Footer Logo
        type: image
        options:
          extensions: [jpg, jpeg, png, webp, svg, gif]
        description: Large logo displayed in the website footer.
      - name: email
        label: Contact Email
        type: string
        description: Primary public contact email address.
      - name: phone
        label: Contact Phone
        type: string
        description: Public telephone / WhatsApp number.
      - name: address
        label: Physical Address / Location
        type: text
        description: Office address shown in footer, sidebar and contact areas.
      - name: copyright
        label: Copyright Statement
        type: string
        description: Footer copyright statement text.
      - name: socialLinks
        label: Social Media Profiles
        type: object
        description: URLs for social media profiles in header, footer, and off-canvas menu.
        fields:
          - name: facebook
            label: Facebook URL
            type: string
          - name: youtube
            label: YouTube URL
            type: string
          - name: instagram
            label: Instagram URL
            type: string
          - name: twitter
            label: Twitter / X URL
            type: string
          - name: behance
            label: Behance URL
            type: string
          - name: dribbble
            label: Dribbble URL
            type: string

  # ============================================================
  # 1. NAVBAR > HOME
  # ============================================================
  - name: homepage
    label: "1. Home: Hero Banner, Quotes & Intro"
    type: file
    path: public/assets/jsonData/homepage/homeData.json
    format: json
    description: "Top hero banner, dynamic animated quotes, and introduction text on the homepage."
    fields:
      - name: hero
        label: Hero Section
        type: object
        fields:
          - name: title1
            label: Hero Heading Line 1
            type: string
            description: First animated main title line (e.g. Imagination).
          - name: title2
            label: Hero Heading Line 2
            type: string
            description: Second animated main title line (e.g. Meets Innovation).
          - name: quote1
            label: Agency Quote Paragraph 1
            type: text
            description: First paragraph of the inspirational agency statement.
          - name: quote2
            label: Agency Quote Paragraph 2
            type: text
            description: Second paragraph of the inspirational agency statement.
          - name: authorName
            label: Quote Author Name
            type: string
            description: Name of the executive / director quoted in the hero section.
          - name: authorRole
            label: Quote Author Role
            type: string
            description: Title or role of the author (e.g. Strategic Creative Advisor).
          - name: buttonText
            label: CTA Button Text
            type: string
            description: Text on the primary action button (e.g. Let's Connect).
          - name: buttonUrl
            label: CTA Button URL
            type: string
            description: Link destination for the action button (e.g. /contact).
          - name: video
            label: Hero Video URL / Path
            type: string
            description: Video asset path (e.g. /assets/video/hero-video.mp4).
      - name: about
        label: Homepage About Section
        type: object
        fields:
          - name: subtitle
            label: Section Subtitle
            type: string
          - name: description
            label: About Description
            type: text
      - name: aboutPage
        label: About Us Page Text
        type: object
        description: Main text content for the dedicated /about page.
        fields:
          - name: subtitle
            label: Subtitle
            type: string
          - name: description1
            label: First Paragraph
            type: text
          - name: description2
            label: Second Paragraph
            type: text
      - name: projects
        label: "Homepage The Works Section Header"
        type: object
        fields:
          - name: subtitle
            label: Section Subtitle
            type: string
          - name: title
            label: Section Title
            type: string
          - name: description
            label: Section Description
            type: text
          - name: buttonText
            label: Button Text
            type: string
          - name: buttonUrl
            label: Button URL
            type: string

  # ============================================================
  # 2. NAVBAR > THE WORKS (7)
  # ============================================================
  - name: featured-projects
    label: "2. The Works: Featured (Homepage Showcase)"
    type: file
    path: public/assets/jsonData/feature/FeatureV1Data.json
    format: json
    list: true
    description: "Curated featured client works displayed on the homepage showcase."
    fields:
      - name: id
        label: Project ID
        type: number
        required: true
        description: Unique numerical ID matching detail route /project-details/[id].
      - name: projectName
        label: Project Name
        type: string
        required: true
      - name: info
        label: Category / Tag
        type: string
        description: Category tag (e.g. Brand Identity, Marketing, Web Design).
      - name: subTitle1
        label: Subtitle Line 1
        type: string
      - name: subTitle2
        label: Subtitle Line 2
        type: string
      - name: thumb
        label: Project Image
        type: image
        options:
          extensions: [jpg, jpeg, png, webp, svg, gif]
      - name: date
        label: Date / Year
        type: string

  - name: all-projects
    label: "2. The Works: All Portfolio Items & Case Studies"
    type: file
    path: public/assets/jsonData/feature/FeatureV2Data.json
    format: json
    list: true
    description: "Full portfolio project directory displayed at /projects and /project-details/[id]."
    fields:
      - name: id
        label: Project ID
        type: number
        required: true
        description: Unique numerical ID matching detail route /project-details/[id].
      - name: name
        label: Project Name
        type: string
        required: true
      - name: info
        label: Category / Tag
        type: string
        description: Category tag (e.g. Brand Identity, Marketing, Web Design).
      - name: textFirst
        label: First Description Line
        type: string
      - name: textLast
        label: Second Description Line
        type: string
      - name: description
        label: Full Project Description
        type: text
        description: Extended description displayed on the /project-details/[id] page.
      - name: thumb
        label: Project Image
        type: image
        options:
          extensions: [jpg, jpeg, png, webp, svg, gif]
      - name: date
        label: Date / Year
        type: string

  # ============================================================
  # 3. NAVBAR > ABOUT US
  # ============================================================
  - name: fun-facts
    label: "3. About Us: 4 Stat Cards & Images (Years, Projects, Awards, Clients)"
    type: file
    path: public/assets/jsonData/fact/FactData.json
    format: json
    list: true
    description: "The 4 key highlight cards on the About Us page & Homepage (Years Experience, Completed Projects, Award Winning, Satisfied Clients). Upload or change the 4 background images here."
    fields:
      - name: id
        label: Card ID
        type: number
      - name: title
        label: Metric Title
        type: string
        description: e.g. Years Experience, Completed Projects, Award Winning, Satisfied Clients
      - name: end
        label: Metric Number
        type: string
        description: Animated counter number (e.g. 12, 25, 110, 4)
      - name: thumb
        label: Card Image
        type: image
        options:
          extensions: [jpg, jpeg, png, webp, svg, gif]
        description: Upload or pick the card's background image (JPG, PNG, WebP, SVG).

  - name: company-values
    label: "3. About Us: Core Company Values"
    type: file
    path: public/assets/jsonData/services/ServicesV2Data.json
    format: json
    list: true
    description: "Core agency philosophies and foundational values displayed on /about."
